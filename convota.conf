# ==============================================================================
# Convota - Forward-Facing Nginx Reverse Proxy Location Configuration
# ==============================================================================
# Drop this file into your frontend server's Nginx modular locations directory:
#   - FreeBSD: /usr/local/etc/nginx/locations/convota.conf
#   - Linux:   /etc/nginx/locations/convota.conf (or /etc/nginx/conf.d/)
#
# Prerequisite:
#   Your frontend HTTPS server block (e.g. in /usr/local/etc/nginx/nginx.conf)
#   must include the directive:
#
#   server {
#       listen 443 ssl http2;
#       server_name arch.ece.uowm.gr;  # your public domain
#       ...
#       include /usr/local/etc/nginx/locations/*.conf;
#       ...
#   }
#
# Adjust the backend IP (10.100.8.102) below if your backend VM/container differs.
# ==============================================================================

# 1. Enforce trailing slash so relative links (css/, js/, api/) resolve cleanly
location = /convota {
    return 301 https://$host/convota/;
}

# 2. Main reverse proxy block
# IMPORTANT: The '^~' modifier is required so that Nginx stops checking regular expressions!
# Without '^~', top-level regular expression locations like 'location ~ \.php$'
# will intercept backend API calls (e.g. /convota/api/quorum) and return 404.
location ^~ /convota/ {
    # Forward to the backend VM IP and port 80.
    # The trailing slash on proxy_pass strips "/convota/" so the backend VM
    # receives root requests (/login, /api/quorum, /assets/css/app.css).
    # The backend VM automatically detects X-Forwarded-Prefix: /convota and routes to Convota.
    proxy_pass http://10.100.8.102/;

    # Host and Client IP headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # SSL and Subpath Propagation:
    # Informs PHP/backend that the external scheme is HTTPS and the subpath is /convota
    # so that generated links, forms, and redirects contain correct public URLs
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /convota;

    # Project and CSV archive uploads up to 50MB
    client_max_body_size 50M;

    # Timeout limits for real-time assembly sessions & CSV batch commits
    proxy_connect_timeout 60s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;

    # Buffer configuration for fast live monitor & projector synchronization
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # HTTP/1.1 persistent connections
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}
