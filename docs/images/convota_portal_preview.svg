<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <filter id="winShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Browser Window Frame -->
  <g filter="url(#winShadow)">
    <rect width="1000" height="640" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="1000" height="42" rx="12" fill="#0f172a"/>
    <rect y="30" width="1000" height="12" fill="#0f172a"/>

    <circle cx="24" cy="21" r="6" fill="#ef4444"/>
    <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="21" r="6" fill="#10b981"/>

    <rect x="250" y="8" width="500" height="26" rx="6" fill="#1e293b"/>
    <text x="500" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
      🔒 https://arch.ece.uowm.gr/convota/organizations/portal
    </text>
  </g>

  <!-- Top App Navigation -->
  <g transform="translate(0, 42)">
    <rect width="1000" height="56" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="30" y="36" font-family="sans-serif" font-size="19" font-weight="900" fill="#2563eb">🗳️ Convota</text>
    
    <g transform="translate(160, 34)" font-family="sans-serif" font-size="13.5" font-weight="600">
      <text x="0" y="0" fill="#64748b">Dashboard</text>
      <text x="100" y="0" fill="#2563eb">Organization Portal</text>
      <line x1="96" y1="8" x2="235" y2="8" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
      <text x="250" y="0" fill="#64748b">Meetings</text>
      <text x="340" y="0" fill="#64748b">Proposals</text>
      <text x="430" y="0" fill="#64748b">Receipts</text>
    </g>

    <g transform="translate(770, 14)">
      <rect width="200" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="100" y="19" font-family="sans-serif" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">
        🔑 Authenticated via Access Key
      </text>
    </g>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(30, 115)">
    <!-- Header Row -->
    <text x="0" y="24" font-family="sans-serif" font-size="20" font-weight="800" fill="#0f172a">
      Delegation Portal — University of Western Macedonia
    </text>
    <text x="0" y="44" font-family="sans-serif" font-size="12" fill="#64748b">
      Designated President Organization • Voting Weight: 1.0 Vote • Status: Active
    </text>

    <!-- Shared Access Key Security Box -->
    <g transform="translate(0, 65)">
      <rect width="940" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="940" height="32" rx="8" fill="#f8fafc"/>
      <rect y="24" width="940" height="8" fill="#f8fafc"/>
      
      <text x="15" y="20" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#334155">
        SHARED DELEGATION ACCESS KEY (COMMON HASH)
      </text>
      <text x="925" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#059669" text-anchor="end">
        ● Key Enabled (Active)
      </text>

      <g transform="translate(15, 45)">
        <rect width="450" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text x="15" y="22" font-family="monospace" font-size="11.5" fill="#0f172a">
          uowm_key_7c8d9e0f1a2b3c4d5e6f7a8b
        </text>
        
        <rect x="360" y="6" width="80" height="24" rx="4" fill="#2563eb"/>
        <text x="400" y="21" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">
          📋 Copy
        </text>

        <!-- Actions -->
        <g transform="translate(470, 0)">
          <rect width="135" height="36" rx="6" fill="#3b82f6"/>
          <text x="67" y="22" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">
            ✉️ Email Key
          </text>

          <rect x="145" y="0" width="135" height="36" rx="6" fill="#f59e0b"/>
          <text x="212" y="22" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">
            🔄 Rotate Key
          </text>

          <rect x="290" y="0" width="165" height="36" rx="6" fill="#10b981"/>
          <text x="372" y="22" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">
            🔔 Email on Use: ON
          </text>
        </g>
      </g>
      <text x="15" y="100" font-family="sans-serif" font-size="10.5" fill="#64748b">
        Direct Login Link: https://arch.ece.uowm.gr/convota/member_login.sh&amp;hash=uowm_key_... (Automatic no-cache &amp; referrer suppression)
      </text>
    </g>

    <!-- Delegation Roster Card -->
    <g transform="translate(0, 190)">
      <rect width="940" height="295" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Table Header -->
      <rect width="940" height="38" rx="8" fill="#f1f5f9"/>
      <rect y="30" width="940" height="8" fill="#f1f5f9"/>
      <text x="20" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#475569">ROLE</text>
      <text x="180" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#475569">DELEGATE NAME</text>
      <text x="400" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#475569">EMAIL (CENTRAL MAILBOX)</text>
      <text x="660" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#475569">PHONE</text>
      <text x="820" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#475569">ACTIONS</text>

      <!-- Row 1: Primary Delegate -->
      <line x1="0" y1="92" x2="940" y2="92" stroke="#f1f5f9" stroke-width="1"/>
      <rect x="20" y="55" width="130" height="24" rx="4" fill="#dbeafe"/>
      <text x="85" y="71" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">★ PRIMARY DELEGATE</text>
      
      <text x="180" y="71" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Minas Dasygenis</text>
      <text x="400" y="71" font-family="sans-serif" font-size="12" fill="#2563eb">convota@email.vlsi.gr</text>
      <text x="660" y="71" font-family="sans-serif" font-size="12" fill="#64748b">+30 24610 56501</text>
      <text x="820" y="71" font-family="sans-serif" font-size="11" font-weight="600" fill="#0284c7">Edit Profile</text>

      <!-- Row 2: Substitute Member -->
      <line x1="0" y1="146" x2="940" y2="146" stroke="#f1f5f9" stroke-width="1"/>
      <rect x="20" y="109" width="130" height="24" rx="4" fill="#f1f5f9"/>
      <text x="85" y="125" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">SUBSTITUTE</text>
      
      <text x="180" y="125" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Konstantinos Stergiou</text>
      <text x="400" y="125" font-family="sans-serif" font-size="12" fill="#2563eb">convota@email.vlsi.gr</text>
      <text x="660" y="125" font-family="sans-serif" font-size="12" fill="#64748b">+30 24610 56502</text>
      <g transform="translate(820, 110)">
        <text x="0" y="15" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#2563eb">Set Primary</text>
        <text x="75" y="15" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#dc2626">Remove</text>
      </g>

      <!-- Add Substitute Button & Audit Notice -->
      <g transform="translate(20, 200)">
        <rect width="900" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="20" y="26" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#334155">
          Need to add a proxy delegate or substitute representative?
        </text>
        <text x="20" y="44" font-family="sans-serif" font-size="10.5" fill="#64748b">
          All modifications are cryptographically signed in the immutable SHA-256 audit log.
        </text>

        <rect x="710" y="15" width="170" height="34" rx="6" fill="#2563eb"/>
        <text x="795" y="36" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle">
          ➕ Add Substitute
        </text>
      </g>
    </g>
  </g>
</svg>