<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <filter id="winShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="blueBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Browser Frame Window -->
  <g filter="url(#winShadow)">
    <!-- Window Body -->
    <rect width="1000" height="620" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Browser Header Bar -->
    <rect width="1000" height="42" rx="12" fill="#0f172a"/>
    <rect y="30" width="1000" height="12" fill="#0f172a"/>

    <!-- Window Controls -->
    <circle cx="24" cy="21" r="6" fill="#ef4444"/>
    <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="21" r="6" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="250" y="8" width="500" height="26" rx="6" fill="#1e293b"/>
    <text x="500" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
      🔒 https://convota.domain.org/convota/dashboard
    </text>
  </g>

  <!-- Top App Navigation -->
  <g transform="translate(0, 42)">
    <rect width="1000" height="56" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Logo -->
    <text x="30" y="36" font-family="sans-serif" font-size="19" font-weight="900" fill="#2563eb">
      🗳️ Convota
    </text>

    <!-- Nav Items -->
    <g transform="translate(160, 34)" font-family="sans-serif" font-size="13.5" font-weight="600">
      <text x="0" y="0" fill="#2563eb">Dashboard</text>
      <line x1="-4" y1="8" x2="74" y2="8" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>

      <text x="100" y="0" fill="#64748b">Organizations</text>
      <text x="220" y="0" fill="#64748b">Meetings</text>
      <text x="310" y="0" fill="#64748b">Proposals</text>
      <text x="400" y="0" fill="#64748b">CSV</text>
      <text x="450" y="0" fill="#64748b">Audit Log</text>
    </g>

    <!-- User Badge -->
    <g transform="translate(800, 16)">
      <rect width="170" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="15" y="18" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#1e293b">👤 Minas Dasygenis</text>
      <rect x="120" y="5" width="42" height="18" rx="4" fill="#2563eb"/>
      <text x="141" y="17" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">ADMIN</text>
    </g>
  </g>

  <!-- DASHBOARD MAIN CONTENT -->
  <!-- Active Assembly Meeting Banner -->
  <g transform="translate(40, 120)">
    <rect width="920" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="25" y="24" width="82" height="24" rx="12" fill="#10b981"/>
    <text x="66" y="40" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">● IN SESSION</text>

    <text x="120" y="42" font-family="sans-serif" font-size="18" font-weight="800" fill="#ffffff">
      2026 Annual General Assembly Session
    </text>
    <text x="25" y="70" font-family="sans-serif" font-size="12" fill="#94a3b8">
      Scheduled: 2026-10-02 10:00 UTC · Location: Grand Hall / Hybrid Online · Roll-Call Presence Open
    </text>

    <g transform="translate(740, 24)">
      <rect width="155" height="38" rx="6" fill="url(#blueBtn)"/>
      <text x="77" y="24" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">
        🖥️ Projector Screen
      </text>
    </g>
  </g>

  <!-- Stat Grid Row -->
  <g transform="translate(40, 225)">
    <!-- Card 1: Dynamic Quorum -->
    <g transform="translate(0, 0)">
      <rect width="445" height="145" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="25" y="32" font-family="sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="0.5">
        DYNAMIC ASSEMBLY QUORUM
      </text>

      <text x="25" y="68" font-family="sans-serif" font-size="28" font-weight="900" fill="#0f172a">
        14 of 28 <tspan font-size="18" font-weight="600" fill="#10b981">(50.0%)</tspan>
      </text>

      <!-- Quorum Progress Bar -->
      <rect x="25" y="85" width="395" height="12" rx="6" fill="#e2e8f0"/>
      <rect x="25" y="85" width="198" height="12" rx="6" fill="url(#barGrad)"/>
      <!-- 50% Marker -->
      <line x1="223" y1="80" x2="223" y2="102" stroke="#dc2626" stroke-width="2"/>
      <text x="223" y="116" font-family="sans-serif" font-size="9" font-weight="700" fill="#dc2626" text-anchor="middle">50% Required</text>

      <text x="25" y="132" font-family="sans-serif" font-size="11" font-weight="600" fill="#059669">
        ✓ Quorum requirement satisfied (Roll-call active)
      </text>
    </g>

    <!-- Card 2: Registered Organizations -->
    <g transform="translate(475, 0)">
      <rect width="445" height="145" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="25" y="32" font-family="sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="0.5">
        COLLECTIVE COMPOSITION
      </text>

      <g transform="translate(25, 48)">
        <text x="0" y="24" font-family="sans-serif" font-size="26" font-weight="800" fill="#2563eb">28</text>
        <text x="0" y="44" font-family="sans-serif" font-size="11" font-weight="600" fill="#64748b">Voting Organizations</text>

        <text x="140" y="24" font-family="sans-serif" font-size="26" font-weight="800" fill="#d97706">1</text>
        <text x="140" y="44" font-family="sans-serif" font-size="11" font-weight="600" fill="#64748b">President Org</text>

        <text x="260" y="24" font-family="sans-serif" font-size="26" font-weight="800" fill="#64748b">4</text>
        <text x="260" y="44" font-family="sans-serif" font-size="11" font-weight="600" fill="#64748b">Observers (0 Votes)</text>
      </g>

      <text x="25" y="132" font-family="sans-serif" font-size="11" font-weight="600" fill="#2563eb">
        President: University of Western Macedonia (1 Vote)
      </text>
    </g>
  </g>

  <!-- Active Proposal Card -->
  <g transform="translate(40, 390)">
    <rect width="920" height="195" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <g transform="translate(25, 25)">
      <rect width="95" height="22" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
      <text x="47" y="15" font-family="sans-serif" font-size="10" font-weight="800" fill="#15803d" text-anchor="middle">VOTING OPEN</text>

      <rect x="105" y="0" width="135" height="22" rx="4" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
      <text x="172" y="15" font-family="sans-serif" font-size="10" font-weight="800" fill="#6d28d9" text-anchor="middle">SECRET DECOUPLED</text>

      <text x="0" y="52" font-family="sans-serif" font-size="17" font-weight="800" fill="#0f172a">
        Proposal #1: Adoption of FY2026 Strategic Roadmap &amp; Budget Allocation
      </text>
      <text x="0" y="74" font-family="sans-serif" font-size="12" fill="#64748b">
        Method: YES / NO / ABSTAIN · Majority Threshold: 50.0% · Required Quorum: ON · Time Remaining: 14m 32s
      </text>

      <!-- Live Voter Tally Bar (Anonymous Progress) -->
      <g transform="translate(0, 95)">
        <rect width="600" height="12" rx="6" fill="#f1f5f9"/>
        <rect width="450" height="12" rx="6" fill="#3b82f6"/>
        <text x="615" y="11" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e293b">21 of 28 Voted (75%)</text>
      </g>
      <text x="0" y="125" font-family="sans-serif" font-size="10.5" fill="#94a3b8">
        🔒 Selections sealed during voting. Unanimous results tally published upon vote closure.
      </text>

      <!-- Actions -->
      <g transform="translate(710, 60)">
        <rect width="160" height="42" rx="6" fill="url(#blueBtn)"/>
        <text x="80" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
          🗳️ Cast Organization Vote
        </text>
      </g>
    </g>
  </g>
</svg>
