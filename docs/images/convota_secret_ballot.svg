<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSecret" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="boxShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="960" height="420" rx="16" fill="url(#bgSecret)" stroke="#1f2937" stroke-width="2"/>

  <!-- Title -->
  <text x="480" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#f9fafb" text-anchor="middle" letter-spacing="0.5">
    PRIVACY-PRESERVING SECRET DECOUPLED BALLOT
  </text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">
    Mathematically impossible to correlate votes back to specific organizations or delegates via database dumps.
  </text>

  <!-- Left: Voter & Org Identity -->
  <g transform="translate(40, 95)" filter="url(#boxShadow)">
    <rect width="250" height="280" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="38" rx="10" fill="#374151"/>
    <text x="20" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#f3f4f6">
      AUTHENTICATED VOTER
    </text>

    <text x="20" y="65" font-family="sans-serif" font-size="11" font-weight="600" fill="#93c5fd">Organization Identity:</text>
    <text x="20" y="82" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Nordic AI Society</text>

    <text x="20" y="115" font-family="sans-serif" font-size="11" font-weight="600" fill="#93c5fd">Designated Representative:</text>
    <text x="20" y="132" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Tuomas Korhonen</text>

    <text x="20" y="165" font-family="sans-serif" font-size="11" font-weight="600" fill="#93c5fd">Voting Power / Weight:</text>
    <text x="20" y="182" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">1.0 Vote</text>

    <!-- Verification Token -->
    <rect x="15" y="210" width="220" height="55" rx="6" fill="#111827" stroke="#4b5563" stroke-width="1"/>
    <text x="25" y="230" font-family="sans-serif" font-size="10" font-weight="700" fill="#f59e0b">Single-Use Ballot Nonce:</text>
    <text x="25" y="248" font-family="monospace" font-size="8.5" fill="#d1d5db">sha256(nonce_org_prop_salt)</text>
  </g>

  <!-- Middle: Cryptographic Isolation Wall -->
  <g transform="translate(325, 95)" filter="url(#boxShadow)">
    <rect width="280" height="280" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="0" y="0" width="280" height="38" rx="10" fill="#312e81"/>
    <text x="20" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#c7d2fe">
      ISOLATION GATE &amp; INTEGRITY
    </text>

    <text x="20" y="65" font-family="sans-serif" font-size="11" font-weight="700" fill="#a5b4fc">Atomic Decoupling Process:</text>

    <g transform="translate(15, 80)">
      <rect width="250" height="50" rx="6" fill="#0f172a" stroke="#4338ca" stroke-width="1"/>
      <text x="10" y="20" font-family="sans-serif" font-size="10" font-weight="700" fill="#e0e7ff">1. SQLite BEGIN IMMEDIATE</text>
      <text x="10" y="36" font-family="sans-serif" font-size="9" fill="#94a3b8">Strict concurrency locks against race condition</text>
    </g>

    <g transform="translate(15, 140)">
      <rect width="250" height="50" rx="6" fill="#0f172a" stroke="#4338ca" stroke-width="1"/>
      <text x="10" y="20" font-family="sans-serif" font-size="10" font-weight="700" fill="#e0e7ff">2. Mark Organization as 'Voted'</text>
      <text x="10" y="36" font-family="sans-serif" font-size="9" fill="#94a3b8">Proposal participation recorded (NO ballot link)</text>
    </g>

    <g transform="translate(15, 200)">
      <rect width="250" height="60" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="10" y="20" font-family="sans-serif" font-size="10" font-weight="800" fill="#a7f3d0">3. Cast Decoupled Ballot</text>
      <text x="10" y="36" font-family="sans-serif" font-size="9" fill="#6ee7b7">Zero Foreign Keys · Zero User ID</text>
      <text x="10" y="50" font-family="sans-serif" font-size="9" fill="#6ee7b7">Zero Organization ID · Zero Timestamps</text>
    </g>
  </g>

  <!-- Right: Anonymous Ballots Table & Verification Receipt -->
  <g transform="translate(640, 95)" filter="url(#boxShadow)">
    <rect width="280" height="280" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="38" rx="10" fill="#047857"/>
    <text x="20" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#ecfdf5">
      anonymous_ballots TABLE
    </text>

    <!-- Schema columns -->
    <g transform="translate(15, 50)" font-family="monospace" font-size="10.5">
      <rect width="250" height="22" rx="4" fill="#065f46"/>
      <text x="10" y="15" fill="#a7f3d0">proposal_id: 1</text>

      <rect y="28" width="250" height="22" rx="4" fill="#065f46"/>
      <text x="10" y="43" fill="#a7f3d0">vote_choice: "YES"</text>

      <rect y="56" width="250" height="22" rx="4" fill="#065f46"/>
      <text x="10" y="71" fill="#a7f3d0">weight: 1.0</text>

      <rect y="84" width="250" height="22" rx="4" fill="#065f46"/>
      <text x="10" y="99" fill="#6ee7b7">receipt_hash: "a4f8c2..."</text>
    </g>

    <!-- Voter Receipt Output -->
    <g transform="translate(15, 175)">
      <rect width="250" height="90" rx="6" fill="#022c22" stroke="#34d399" stroke-width="1"/>
      <text x="10" y="20" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#34d399">
        🎫 Cryptographic Voter Receipt
      </text>
      <text x="10" y="36" font-family="monospace" font-size="8" fill="#d1fae5">
        Receipt: b3a7...9e21
      </text>
      <text x="10" y="54" font-family="sans-serif" font-size="9" fill="#a7f3d0">
        Voters can verify their receipt hash was included in the final tally without revealing their vote to anyone else.
      </text>
    </g>
  </g>
</svg>
