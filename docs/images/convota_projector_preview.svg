<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <linearGradient id="projBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="yesGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="noGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="absGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="pGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Big Cinema Screen Frame -->
  <rect width="1000" height="580" rx="14" fill="url(#projBg)" stroke="#1e293b" stroke-width="3"/>

  <!-- Top Projector Header -->
  <g transform="translate(50, 45)">
    <rect width="900" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#38bdf8" letter-spacing="1">
      🏛️ CONVOTA ASSEMBLY HALL PROJECTOR DISPLAY
    </text>

    <!-- Quorum Badge on Projector -->
    <g transform="translate(620, 14)">
      <rect width="255" height="32" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="18" cy="16" r="6" fill="#10b981"/>
      <text x="34" y="21" font-family="sans-serif" font-size="12" font-weight="800" fill="#a7f3d0">
        QUORUM: 21 / 28 ORGS (75.0%) ✓
      </text>
    </g>
  </g>

  <!-- Main Proposal Banner -->
  <g transform="translate(50, 130)">
    <rect width="900" height="90" rx="10" fill="#111827" stroke="#374151" stroke-width="1"/>
    
    <g transform="translate(25, 25)">
      <rect width="140" height="24" rx="4" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
      <text x="70" y="16" font-family="sans-serif" font-size="11" font-weight="900" fill="#c7d2fe" text-anchor="middle">
        RESULTS VERIFIED
      </text>

      <text x="160" y="18" font-family="sans-serif" font-size="14" font-weight="600" fill="#9ca3af">
        Secret Decoupled Ballot · Quorum: Satisfied (75.0% ≥ 50.0%)
      </text>

      <text x="0" y="50" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">
        Proposal #1: Adoption of FY2026 Strategic Roadmap &amp; Budget Allocation
      </text>
    </g>
  </g>

  <!-- Results Bars Visualization -->
  <g transform="translate(50, 245)">
    <rect width="900" height="280" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1"/>

    <!-- Option 1: YES (78.6%) -->
    <g transform="translate(35, 30)">
      <text x="0" y="20" font-family="sans-serif" font-size="18" font-weight="800" fill="#34d399">YES / IN FAVOR</text>
      <text x="700" y="20" font-family="sans-serif" font-size="18" font-weight="800" fill="#34d399" text-anchor="end">22.0 Votes (78.6%)</text>
      <!-- Bar Container -->
      <rect y="30" width="830" height="32" rx="6" fill="#1f2937"/>
      <rect y="30" width="652" height="32" rx="6" fill="url(#yesGrad)"/>
    </g>

    <!-- Option 2: NO (14.3%) -->
    <g transform="translate(35, 110)">
      <text x="0" y="20" font-family="sans-serif" font-size="18" font-weight="800" fill="#f87171">NO / AGAINST</text>
      <text x="700" y="20" font-family="sans-serif" font-size="18" font-weight="800" fill="#f87171" text-anchor="end">4.0 Votes (14.3%)</text>
      <!-- Bar Container -->
      <rect y="30" width="830" height="32" rx="6" fill="#1f2937"/>
      <rect y="30" width="118" height="32" rx="6" fill="url(#noGrad)"/>
    </g>

    <!-- Option 3: ABSTAIN (7.1%) -->
    <g transform="translate(35, 190)">
      <text x="0" y="20" font-family="sans-serif" font-size="18" font-weight="800" fill="#94a3b8">ABSTAIN</text>
      <text x="700" y="20" font-family="sans-serif" font-size="18" font-weight="800" fill="#94a3b8" text-anchor="end">2.0 Votes (7.1%)</text>
      <!-- Bar Container -->
      <rect y="30" width="830" height="32" rx="6" fill="#1f2937"/>
      <rect y="30" width="59" height="32" rx="6" fill="url(#absGrad)"/>
    </g>
  </g>
</svg>
